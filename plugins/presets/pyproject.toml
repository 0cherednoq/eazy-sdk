[project]
name = "eazy-sdk-presets"
version = "0.1.0a1"
description = "First-party Cloudflare and reCAPTCHA protection descriptors for Eazy SDK."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "cloudflare", "recaptcha", "web"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["eazy-sdk>=0.1.0a1,<0.2"]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
selectolax = ["selectolax>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_presets"]

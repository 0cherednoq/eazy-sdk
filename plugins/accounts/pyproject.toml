[project]
name = "eazy-sdk-accounts"
version = "0.2.0a5"
description = "Account registration, verification and multi-account storage for Eazy SDK."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "accounts", "registration", "storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["eazy-sdk>=0.2.0a5,<0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_accounts"]

[tool.uv.sources]
eazy-sdk = { workspace = true }

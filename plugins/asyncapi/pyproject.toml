[project]
name = "eazy-sdk-asyncapi"
version = "0.2.0a4"
description = "AsyncAPI 3.0 WebSocket SDK generator targeting Eazy SDK."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "asyncapi", "websocket", "codegen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["eazy-sdk>=0.2.0a4,<0.3"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
eazy-sdk-asyncapi = "eazy_sdk_asyncapi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_asyncapi"]

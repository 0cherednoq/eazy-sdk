[project]
name = "eazy-sdk-adaptix"
version = "0.2.0a7"
description = "Adaptix retort as an Eazy SDK model adapter."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "adaptix", "models"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["eazy-sdk>=0.2.0a7,<0.3", "adaptix>=3.0.0b12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_adaptix"]

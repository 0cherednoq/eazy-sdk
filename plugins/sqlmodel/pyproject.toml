[project]
name = "eazy-sdk-sqlmodel"
version = "0.2.0a2"
description = "SQLModel/SQLAlchemy async storage backend for Eazy SDK."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "sqlmodel", "sqlalchemy", "storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["eazy-sdk>=0.2.0a2,<0.3", "sqlmodel>=0.0.22", "aiosqlite>=0.20"]

[project.scripts]
eazy-sdk-sqlmodel-migrate = "eazy_sdk_sqlmodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_sqlmodel"]

[tool.uv.sources]
eazy-sdk = { workspace = true }

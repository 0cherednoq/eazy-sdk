[project]
name = "eazy-sdk-sqlmodel"
version = "0.2.0a7"
description = "SQLModel/SQLAlchemy async storage backend for Eazy SDK."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "sqlmodel", "sqlalchemy", "storage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "eazy-sdk-core>=0.2.0a7,<0.3",
  "eazy-sdk-accounts>=0.2.0a7,<0.3",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2",
  "pydantic>=2",
  "aiosqlite>=0.20",
]

[project.scripts]
eazy-sdk-sqlmodel-migrate = "eazy_sdk_sqlmodel.cli:main"

[project.urls]
Homepage = "https://github.com/0cherednoq/eazy-sdk"
Documentation = "https://0cherednoq.github.io/eazy-sdk/"
Repository = "https://github.com/0cherednoq/eazy-sdk"
Changelog = "https://github.com/0cherednoq/eazy-sdk/blob/master/CHANGELOG.md"
Issues = "https://github.com/0cherednoq/eazy-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_sqlmodel"]

[tool.uv.sources]
eazy-sdk-core = { workspace = true }
eazy-sdk-accounts = { workspace = true }

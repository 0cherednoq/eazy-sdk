[project]
name = "eazy-sdk-openapi"
version = "0.2.0a3"
description = "OpenAPI 3.0/3.1/3.2 SDK generator targeting the Eazy SDK execution contract."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "openapi", "http", "codegen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "eazy-sdk>=0.2.0a3,<0.3",
  "datamodel-code-generator>=0.26,<1",
  "pydantic[email]>=2",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
eazy-sdk-openapi = "eazy_sdk_openapi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk_openapi"]

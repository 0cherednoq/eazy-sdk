[project]
name = "eazy-sdk"
version = "0.2.0a4"
description = "Transport-independent runtime for typed HTTP and async WebSocket SDKs."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "http", "websocket", "openapi", "asyncapi", "typed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "zapros==0.16.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
httpx = ["httpx>=0.27"]
requests = ["requests>=2.31"]
curl-cffi = ["curl_cffi>=0.7"]
websocket = ["zapros[websocket]==0.16.0"]
html = ["eazy-sdk-html>=0.2.0a4,<0.3"]
accounts = ["eazy-sdk-accounts>=0.2.0a4,<0.3"]
sqlmodel = ["eazy-sdk-sqlmodel>=0.2.0a4,<0.3"]
all = ["pydantic>=2", "msgspec>=0.21.1", "httpx>=0.27", "requests>=2.31", "curl_cffi>=0.7", "zapros[websocket]==0.16.0", "eazy-sdk-sqlmodel>=0.2.0a4,<0.3", "eazy-sdk-html>=0.2.0a4,<0.3", "eazy-sdk-accounts>=0.2.0a4,<0.3"]
msgspec = [
    "msgspec>=0.21.1",
]

[dependency-groups]
dev = [
  "coverage>=7.6",
  "hypothesis>=6.112",
  "mutmut>=3.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "pytest-timeout>=2.3",
  "basedpyright>=1.31",
  "ty>=0.0.74",
  "mypy>=1.10",
  "ruff>=0.5",
  "pydantic>=2",
  "httpx>=0.27",
  "requests>=2.31",
  "curl_cffi>=0.7",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "eazy-sdk-sqlmodel",
  "eazy-sdk-openapi[yaml]",
  "eazy-sdk-asyncapi[yaml]",
  "eazy-sdk-presets",
  "eazy-sdk-accounts",
  "eazy-sdk-html",
  "eazy-sdk-xml",
  "ipykernel>=7.2.0",
  "zapros[pyreqwest,websocket]==0.16.0",
  "msgspec==0.21.1",
  "parsel>=1.11.0",
  "adaptix>=3.0.0b12",
]

docs = [
  "myst-parser>=5,<6",
  "shibuya>=2026.1,<2027",
  "sphinx>=9,<10",
  "sphinx-copybutton>=0.5,<0.6",
  "sphinx-design>=0.7,<0.8",
  "sphinx-llms-txt>=0.7,<0.8",
]

auth-conformance = [
  # Keep the optional IAM stack on its last stable WTForms-compatible release. Newer Canaille
  # currently requires a WTForms pre-release, which makes an ordinary reproducible uv lock fail.
  "canaille[oidc]==0.0.87",
  # Canaille 0.0.87 expects Key.as_dict() to include private signing material by default.
  "joserfc==1.4.0",
  "pytest-iam==0.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = [
  "plugins/accounts",
  "plugins/asyncapi",
  "plugins/html",
  "plugins/openapi",
  "plugins/presets",
  "plugins/sqlmodel",
  "plugins/xml",
]

[tool.uv.sources]
eazy-sdk = { workspace = true }
eazy-sdk-sqlmodel = { workspace = true }
eazy-sdk-openapi = { workspace = true }
eazy-sdk-asyncapi = { workspace = true }
eazy-sdk-presets = { workspace = true }
eazy-sdk-accounts = { workspace = true }
eazy-sdk-html = { workspace = true }
eazy-sdk-xml = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/eazy_sdk", "/CHANGELOG.md", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# plugins/sqlmodel/tests is intentionally __init__-less: with __init__.py both trees form a
# package named "tests" and their conftests collide; importlib mode gives them unique module names.
testpaths = [
  "tests",
  "plugins/accounts/tests",
  "plugins/html/tests",
  "plugins/asyncapi/tests",
  "plugins/openapi/tests",
  "plugins/presets/tests",
  "plugins/sqlmodel/tests",
  "plugins/xml/tests",
]
addopts = "--import-mode=importlib --strict-markers -p no:cacheprovider --basetemp=.test-tmp/pytest --ignore=tests/fixtures/openapi_consumer/consumer_sdk -m 'not auth_conformance'"
timeout = 10
filterwarnings = [
  "error",
  # curl_cffi uses a selector helper thread with Proactor on Windows. This is emitted by the
  # dependency itself and is covered by the async first-hop transport test.
  "ignore::curl_cffi.utils.CurlCffiWarning:curl_cffi.aio",
]
markers = [
  "unit: fast isolated behaviour tests without real sockets",
  "integration: localhost HTTP/socket tests across component boundaries",
  "live_network: opt-in tests against public third-party network services",
  "auth_conformance: OAuth2/OIDC protocol tests against the optional local IAM server",
  "property: Hypothesis tests for stable invariants",
  "regression: reproductions retained for real defects",
  "slow: optional tests excluded from the fastest development loop",
]

[tool.coverage.run]
branch = true
source = ["eazy_sdk", "eazy_sdk_asyncapi", "eazy_sdk_openapi"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = [
  "plugins/openapi/eazy_sdk_openapi",
  "eazy_sdk/auth",
  "eazy_sdk/clients",
  "eazy_sdk/middleware.py",
  "eazy_sdk/protection.py",
  "eazy_sdk/request",
  "eazy_sdk/response",
]
pytest_add_cli_args_test_selection = ["tests", "plugins/openapi/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Notebooks are doc artifacts (generated, thin reuse of the .py examples); don't lint them.
extend-exclude = [
  ".test-tmp",
  "examples/notebooks",
  "tests/fixtures/openapi_consumer/consumer_sdk",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Gallery examples bootstrap sys.path before importing shared fixtures (_shared/_burp),
# so module-level imports legitimately follow a statement.
"examples/**" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["eazy_sdk", "tests", "plugins", "scripts", "examples"]
exclude = ["tests/fixtures/openapi_consumer/consumer_sdk"]
# Lets tests do `import docs_freshness` (they add scripts/ to sys.path at runtime).
mypy_path = ["scripts", "plugins/openapi", "plugins/xml"]

[project]
name = "eazy-sdk"
version = "0.2.0a7"
description = "Transport-independent runtime for typed HTTP and async WebSocket SDKs."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eazy SDK contributors" }]
keywords = ["sdk", "http", "websocket", "openapi", "asyncapi", "typed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "zapros==0.16.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
httpx = ["httpx>=0.27"]
requests = ["requests>=2.31"]
curl-cffi = ["curl_cffi>=0.7"]
websocket = ["zapros[websocket]==0.16.0"]
html = ["eazy-sdk-html>=0.2.0a7,<0.3"]
accounts = ["eazy-sdk-accounts>=0.2.0a7,<0.3"]
sqlmodel = ["eazy-sdk-sqlmodel>=0.2.0a7,<0.3"]
# Браузерные SDK. В `all` не входит: драйвер тянет за собой сам браузер.
browser = ["eazy-sdk-browser>=0.2.0a7,<0.3"]
all = ["pydantic>=2", "msgspec>=0.21.1", "httpx>=0.27", "requests>=2.31", "curl_cffi>=0.7", "zapros[websocket]==0.16.0", "eazy-sdk-sqlmodel>=0.2.0a7,<0.3", "eazy-sdk-html>=0.2.0a7,<0.3", "eazy-sdk-accounts>=0.2.0a7,<0.3"]
msgspec = [
    "msgspec>=0.21.1",
]

[dependency-groups]
dev = [
  "coverage>=7.6",
  "hypothesis>=6.112",
  "mutmut>=3.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-httpserver>=1.1",
  "pytest-timeout>=2.3",
  "basedpyright>=1.31",
  "ty>=0.0.74",
  "pyrefly>=0.60.0",
  "mypy>=1.10",
  "ruff>=0.5",
  "pydantic>=2",
  "httpx>=0.27",
  "requests>=2.31",
  "curl_cffi>=0.7",
  "sqlmodel>=0.0.22",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "eazy-sdk-sqlmodel",
  "eazy-sdk-openapi[yaml]",
  "eazy-sdk-asyncapi[yaml]",
  "eazy-sdk-presets",
  "eazy-sdk-accounts",
  "eazy-sdk-html",
  "eazy-sdk-xml",
  "eazy-sdk-adaptix",
  "eazy-sdk-browser",
  "playwright>=1.55",
  "pydoll-python>=3,<4",
  "import-linter>=2.3",
  "complexipy>=6.2",
  "ipykernel>=7.2.0",
  "zapros[pyreqwest,websocket]==0.16.0",
  "msgspec==0.21.1",
  "parsel>=1.11.0",
  "adaptix>=3.0.0b12",
]

docs = [
  "myst-parser>=5,<6",
  "shibuya>=2026.1,<2027",
  "sphinx>=9,<10",
  "sphinx-copybutton>=0.5,<0.6",
  "sphinx-design>=0.7,<0.8",
  "sphinx-llms-txt>=0.7,<0.8",
]

auth-conformance = [
  # Keep the optional IAM stack on its last stable WTForms-compatible release. Newer Canaille
  # currently requires a WTForms pre-release, which makes an ordinary reproducible uv lock fail.
  "canaille[oidc]==0.0.87",
  # Canaille 0.0.87 expects Key.as_dict() to include private signing material by default.
  "joserfc==1.4.0",
  "pytest-iam==0.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = [
  "plugins/accounts",
  "plugins/adaptix",
  "plugins/asyncapi",
  "plugins/browser",
  "plugins/html",
  "plugins/openapi",
  "plugins/presets",
  "plugins/sqlmodel",
  "plugins/xml",
]

[tool.uv.sources]
eazy-sdk = { workspace = true }
eazy-sdk-sqlmodel = { workspace = true }
eazy-sdk-openapi = { workspace = true }
eazy-sdk-asyncapi = { workspace = true }
eazy-sdk-presets = { workspace = true }
eazy-sdk-accounts = { workspace = true }
eazy-sdk-html = { workspace = true }
eazy-sdk-xml = { workspace = true }
eazy-sdk-adaptix = { workspace = true }
eazy-sdk-browser = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["eazy_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/eazy_sdk", "/CHANGELOG.md", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# plugins/sqlmodel/tests is intentionally __init__-less: with __init__.py both trees form a
# package named "tests" and their conftests collide; importlib mode gives them unique module names.
testpaths = [
  "tests",
  "plugins/accounts/tests",
  "plugins/adaptix/tests",
  "plugins/html/tests",
  "plugins/browser/tests",
  "plugins/asyncapi/tests",
  "plugins/openapi/tests",
  "plugins/presets/tests",
  "plugins/sqlmodel/tests",
  "plugins/xml/tests",
]
addopts = "--import-mode=importlib --strict-markers -p no:cacheprovider --basetemp=.test-tmp/pytest --ignore=tests/fixtures/openapi_consumer/consumer_sdk -m 'not auth_conformance'"
timeout = 120
filterwarnings = [
  "error",
  # curl_cffi uses a selector helper thread with Proactor on Windows. This is emitted by the
  # dependency itself and is covered by the async first-hop transport test.
  "ignore::curl_cffi.utils.CurlCffiWarning:curl_cffi.aio",
]
markers = [
  "unit: fast isolated behaviour tests without real sockets",
  "integration: localhost HTTP/socket tests across component boundaries",
  "contract: adapter conformance to the capability profile it declares",
  "live_network: opt-in tests against public third-party network services",
  "auth_conformance: OAuth2/OIDC protocol tests against the optional local IAM server",
  "property: Hypothesis tests for stable invariants",
  "regression: reproductions retained for real defects",
  "slow: optional tests excluded from the fastest development loop",
]

[tool.coverage.run]
branch = true
source = ["eazy_sdk", "eazy_sdk_asyncapi", "eazy_sdk_openapi", "eazy_sdk_browser"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = [
  "plugins/openapi/eazy_sdk_openapi",
  "eazy_sdk/auth",
  "eazy_sdk/clients",
  "eazy_sdk/middleware.py",
  "eazy_sdk/protection.py",
  "eazy_sdk/request",
  "eazy_sdk/response",
]
pytest_add_cli_args_test_selection = ["tests", "plugins/openapi/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Notebooks are doc artifacts (generated, thin reuse of the .py examples); don't lint them.
extend-exclude = [
  ".test-tmp",
  # Пробник типизатора: намеренные ошибки, предмет проверки, а не её объект.
  "plugins/browser/probe",
  "examples/notebooks",
  "tests/fixtures/openapi_consumer/consumer_sdk",
]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # сортировка импортов
  "UP",          # устаревший синтаксис
  "B",           # bugbear: явные ошибки
  "ASYNC",       # async-ошибки
  "T20",         # запрет print
  "DTZ",         # datetime без timezone
  "BLE",         # blind except
  "S",           # bandit: безопасность
  "SIM",         # упрощение кода
  "RET",         # лишние ветки return
  "C4",          # comprehensions
  "RUF",         # правила Ruff
  "ANN",         # обязательные типы
  "FIX",         # запрет TODO/FIXME/HACK
  "ERA",         # закомментированный код
  "C901",        # цикломатическая сложность McCabe
  "PLR0913",     # не более пяти аргументов
  "PLR1702",     # вложенность блоков (preview-правило)
  "PTH",         # pathlib вместо os.path
  "N",           # pep8-naming
  "FURB",        # модернизация устаревших паттернов
  "PERF",        # O(n²) и прочая расточительность
  "SLF",         # доступ к чужим private-членам
  "D",           # докстринги публичного API
]
ignore = [
  "E501",    # длину строк контролирует форматер
  "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях
  "D203", "D213",  # конфликтующие альтернативы выбранного стиля докстрингов
  "D105", "D107",  # магия и __init__ описываются докстрингом класса, а не своим
  # D102: методы протоколов и адаптеров описаны докстрингом класса. Требовать свой
  # на каждый — плодить «Кликнуть по элементу», то есть ровно тот шум, от которого
  # библиотека и уходит. Классы (D101) и функции (D103) остаются.
  "D102",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 5
max-nested-blocks = 3

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]
# Список долга: правила, которые код ещё не проходит. Он только сокращается —
# это условие приёмки шага 3 (`plugins/browser/docs/MERGE.md` §10). Новый код,
# включая `plugins/browser`, держит полный набор с первого дня.
"eazy_sdk/**/*.py" = ["ANN401", "ASYNC109", "BLE001", "C401", "C409", "C901", "D100", "D101", "D103", "D104", "D202", "D401", "N801", "N802", "N818", "PERF401", "PERF402", "PERF403", "PLR0913", "PLR1702", "S101", "S311", "SLF001"]
"tests/**/*.py" = ["ANN001", "ANN202", "ANN401", "BLE001", "C402", "C416", "C901", "D100", "D101", "D103", "D104", "D202", "D205", "D209", "D401", "DTZ001", "N801", "N805", "N818", "PERF401", "PLR0913", "PLR1702", "S101", "S102", "S105", "S106", "S107", "S301", "S324", "S603", "SLF001", "T201"]
"scripts/**/*.py" = ["BLE001", "C901", "D103", "D202", "D401", "PERF401", "PLR1702", "S603", "S607", "T201"]
"examples/**/*.py" = ["D101", "D103", "D202", "I001", "PLR0913", "S101", "T201"]
"docs-site/**/*.py" = ["D103", "T201"]
"plugins/accounts/**/*.py" = ["ANN401", "D100", "D101", "D103", "D202", "N802", "PERF401", "PLR0913", "PLR1702", "S101", "S105", "S311", "S603"]
"plugins/adaptix/**/*.py" = ["ANN401", "D101", "D103", "D202", "S101"]
"plugins/asyncapi/**/*.py" = ["C409", "D100", "D101", "D103", "PLR1702", "S101", "S603", "T201"]
"plugins/html/**/*.py" = ["ANN401", "D100", "D101", "D103", "D202", "S101", "S105", "S603"]
"plugins/openapi/**/*.py" = ["ANN401", "ASYNC221", "C401", "C901", "D100", "D101", "D103", "D202", "D401", "PERF401", "PLR0913", "PLR1702", "RET504", "S101", "S106", "S603", "T201"]
"plugins/presets/**/*.py" = ["ANN401", "D100", "D101", "D103", "FURB167", "PLR0913", "S101"]
"plugins/sqlmodel/**/*.py" = ["ANN001", "ANN002", "ANN201", "ANN202", "ANN401", "BLE001", "C901", "D100", "D101", "D103", "D202", "PERF401", "PLR0913", "RET504", "S101", "S105", "T201"]
"plugins/xml/**/*.py" = ["BLE001", "D100", "D101", "D103", "PLR1702", "S101", "S314"]
# Тесты браузера: `assert` в тесте — инструмент, а не глухая проверка;
# докстринги и аннотации там тоже не несут смысла.
"plugins/browser/tests/**/*.py" = ["S101", "S105", "S106", "ANN", "PLR2004", "SLF001", "ARG", "FIX", "D"]

# ---------- Архитектурные контракты ----------
#
# Границы держатся проверкой, а не договорённостью. Первые два контракта переехали
# вместе с браузерной библиотекой; вторые два появились ради слияния и отвечают на
# главный его риск — что ядро начнёт обрастать понятиями надстройки.

[tool.importlinter]
root_packages = ["eazy_sdk", "eazy_sdk_browser", "eazy_sdk_accounts"]
include_external_packages = true

# Ядро браузера не знает ни одного драйвера: связь только через адаптер.
[[tool.importlinter.contracts]]
name = "browser-core-does-not-know-drivers"
type = "forbidden"
source_modules = [
  "eazy_sdk_browser.api",
  "eazy_sdk_browser.client",
  "eazy_sdk_browser.conditions",
  "eazy_sdk_browser.content",
  "eazy_sdk_browser.driver",
  "eazy_sdk_browser.errors",
  "eazy_sdk_browser.failures",
  "eazy_sdk_browser.fetch",
  "eazy_sdk_browser.interceptors",
  "eazy_sdk_browser.locators",
  "eazy_sdk_browser.login",
  "eazy_sdk_browser.navigation",
  "eazy_sdk_browser.network",
  "eazy_sdk_browser.operations",
  "eazy_sdk_browser.outcomes",
  "eazy_sdk_browser.profile",
  "eazy_sdk_browser.rich_text",
  "eazy_sdk_browser.session",
  "eazy_sdk_browser.spec",
  "eazy_sdk_browser.state",
]
forbidden_modules = ["playwright", "selenium", "camoufox", "pydoll"]

# Ядро браузера не знает и о необязательных интеграциях: разбор ответа и хранилище
# приходят протоколом, а не импортом. Само ядро `eazy_sdk` ему доступно: ошибки,
# профиль возможностей и шкала уровней — общие, плагин не заводит своих.
[[tool.importlinter.contracts]]
name = "browser-core-does-not-know-integrations"
type = "forbidden"
source_modules = [
  "eazy_sdk_browser.api",
  "eazy_sdk_browser.client",
  "eazy_sdk_browser.conditions",
  "eazy_sdk_browser.content",
  "eazy_sdk_browser.driver",
  "eazy_sdk_browser.errors",
  "eazy_sdk_browser.failures",
  "eazy_sdk_browser.fetch",
  "eazy_sdk_browser.interceptors",
  "eazy_sdk_browser.locators",
  "eazy_sdk_browser.login",
  "eazy_sdk_browser.navigation",
  "eazy_sdk_browser.network",
  "eazy_sdk_browser.operations",
  "eazy_sdk_browser.outcomes",
  "eazy_sdk_browser.profile",
  "eazy_sdk_browser.rich_text",
  "eazy_sdk_browser.session",
  "eazy_sdk_browser.spec",
  "eazy_sdk_browser.state",
]
forbidden_modules = [
  "eazy_sdk_accounts",
  "eazy_sdk_browser.integrations",
  "eazy_sdk_browser.handlers",
]

# Ядро браузера не владеет жизненным циклом сессии: он живёт в одном модуле `session`
# (один объект на контекст), а клиент знает только протокол `SessionSource`. `login`
# сюда не входит — он импортирует `session` лениво, в `BrowserLogin.session()`. Имена
# `SessionLifecycle` и `asyncio.Lock` вне `session.py` проверяет `tests/test_layers.py`.
[[tool.importlinter.contracts]]
name = "browser-core-does-not-orchestrate"
type = "forbidden"
source_modules = [
  "eazy_sdk_browser.api",
  "eazy_sdk_browser.client",
  "eazy_sdk_browser.conditions",
  "eazy_sdk_browser.content",
  "eazy_sdk_browser.driver",
  "eazy_sdk_browser.errors",
  "eazy_sdk_browser.failures",
  "eazy_sdk_browser.fetch",
  "eazy_sdk_browser.interceptors",
  "eazy_sdk_browser.locators",
  "eazy_sdk_browser.navigation",
  "eazy_sdk_browser.network",
  "eazy_sdk_browser.operations",
  "eazy_sdk_browser.outcomes",
  "eazy_sdk_browser.profile",
  "eazy_sdk_browser.rich_text",
  "eazy_sdk_browser.spec",
  "eazy_sdk_browser.state",
]
forbidden_modules = ["eazy_sdk_browser.session"]

# Зависимость односторонняя: браузер знает про HTTP, HTTP про браузер — никогда.
# Без этого контракта слияние кончилось бы тем, ради чего его и не делают.
[[tool.importlinter.contracts]]
name = "http-core-does-not-know-the-browser"
type = "forbidden"
source_modules = ["eazy_sdk"]
forbidden_modules = ["eazy_sdk_browser", "playwright", "selenium", "camoufox", "pydoll"]

# «Транспортно нейтрально» — проверяемое утверждение, а не похвала: общий слой не
# знает ни запроса zapros, ни браузера. Сегодня это так, и должно таким остаться.
[[tool.importlinter.contracts]]
name = "shared-storage-is-transport-neutral"
type = "forbidden"
source_modules = ["eazy_sdk_accounts.storage"]
forbidden_modules = ["zapros", "eazy_sdk_browser", "playwright", "selenium"]

# ---------- Когнитивная сложность ----------
#
# Пока считается только по браузерному плагину. По `eazy_sdk` порог 15 сейчас
# нарушают 62 функции — это тот же долг, что и в списке ruff выше, и гасится так же.

[tool.complexipy]
paths = ["plugins/browser/eazy_sdk_browser"]
max-complexity-allowed = 15

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["eazy_sdk", "tests", "plugins", "scripts", "examples"]
exclude = ["tests/fixtures/openapi_consumer/consumer_sdk", "plugins/browser/probe"]
# Lets tests do `import docs_freshness` (they add scripts/ to sys.path at runtime).
mypy_path = ["scripts", "plugins/openapi", "plugins/xml"]

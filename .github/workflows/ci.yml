name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-extras --locked
      - name: Ruff
        run: uv run ruff check
      - name: Mypy
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Cognitive complexity
        run: uv run complexipy --plain --failed
      # Браузерные тесты пропускаются без Chromium, а не падают, — но тогда они ничего
      # и не проверяют. Ставим браузер, чтобы адаптер был проверен настоящим движком.
      - name: Chromium for the browser plugin
        run: uv run playwright install --with-deps chromium
      - name: Tests
        run: uv run pytest -q
      - name: Absence audit
        run: uv run python scripts/absence_audit.py
      - name: Docs freshness
        run: uv run python scripts/docs_freshness.py check
      - name: Docs validation
        run: uv run python docs-site/scripts/validate_docs.py
      - name: Sphinx (strict)
        run: >
          uv run --with-requirements docs-site/requirements.txt
          sphinx-build -W --keep-going -b dirhtml -c docs-site
          docs-site/src/content/docs .test-tmp/sphinx

  packaging:
    name: packaging (wheel, audit, extras smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build the distribution
        run: uv build --out-dir dist/ci
      - name: Package audit
        run: uv run --no-project --python 3.13 python scripts/package_audit.py dist/ci
      - name: Extras smoke (fresh venv per extra)
        run: uv run --no-project --python 3.13 python scripts/extras_smoke.py dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/ci
          if-no-files-found: error

  pydoll:
    name: pydoll (${{ matrix.requirement }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirement: ["pydoll-python==3.0.0", "pydoll-python>=3,<4"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked
      - name: Select Pydoll version
        run: uv pip install "${{ matrix.requirement }}"
      - name: Chromium for the browser plugin
        run: uv run playwright install --with-deps chromium
      - name: Native Pydoll adapter
        run: >
          uv run pytest -q plugins/browser/tests/test_pydoll_handler.py
          plugins/browser/tests/test_driver_contract.py -k pydoll

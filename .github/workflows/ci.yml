name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install workspace
        run: uv sync --locked --all-packages --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Check documentation fingerprints
        run: uv run python scripts/docs_freshness.py check
      - name: Build distributions
        run: |
          uv build --out-dir dist/release
          uv build plugins/asyncapi --out-dir dist/release
          uv build plugins/openapi --out-dir dist/release
          uv build plugins/presets --out-dir dist/release
          uv build plugins/sqlmodel --out-dir dist/release
          uv build plugins/xml --out-dir dist/release
      - name: Audit distributions
        run: uv run python scripts/package_audit.py dist/release

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Validate documentation metadata
        run: uv run --frozen --group docs python docs-site/scripts/validate_docs.py
      - name: Build Sphinx documentation
        run: uv run --frozen --group docs sphinx-build -W --keep-going -b dirhtml -c docs-site docs-site/src/content/docs docs-site/_build/html

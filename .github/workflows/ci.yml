name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-extras --locked
      - name: Ruff
        run: uv run ruff check
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Absence audit
        run: uv run python scripts/absence_audit.py
      - name: Docs freshness
        run: uv run python scripts/docs_freshness.py check
      - name: Docs validation
        run: uv run python docs-site/scripts/validate_docs.py
      - name: Sphinx (strict)
        run: >
          uv run --with-requirements docs-site/requirements.txt
          sphinx-build -W --keep-going -b dirhtml -c docs-site
          docs-site/src/content/docs .test-tmp/sphinx

  packaging:
    name: packaging (wheels, audit, extras smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build every workspace member
        run: uv build --all-packages --out-dir dist/ci
      - name: Package audit
        run: uv run --no-project --python 3.13 python scripts/package_audit.py dist/ci
      - name: Extras smoke (fresh venv per extra)
        run: uv run --no-project --python 3.13 python scripts/extras_smoke.py dist/ci
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/ci
          if-no-files-found: error

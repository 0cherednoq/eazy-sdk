# Documentation site: Sphinx + Shibuya, sources in docs-site/.
# Pull requests are covered by the strict Sphinx step in ci.yml; this workflow builds the same
# way on master and publishes the result to GitHub Pages.
# One-time repository setup: Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-extras --locked
      - name: Docs validation
        run: uv run python docs-site/scripts/validate_docs.py
      - name: Sphinx (strict)
        run: >
          uv run --with-requirements docs-site/requirements.txt
          sphinx-build -W --keep-going -b dirhtml -c docs-site
          docs-site/src/content/docs docs-site/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
